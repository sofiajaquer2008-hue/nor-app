```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comenzar - NorApp</title>
    <link rel="stylesheet" href="../css/estilo.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #EAF5FF, #F4F8FB);
        }

        .registro-contenedor {
            width: 100%;
            max-width: 620px;
            background: white;
            border-radius: 28px;
            padding: 38px;
            box-shadow: 0 12px 35px rgba(11, 60, 93, 0.12);
        }

        .logo-registro {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-registro h1 {
            color: #0B3C5D;
            font-size: 36px;
            margin: 0;
        }

        .logo-registro p {
            color: #526572;
            margin-top: 8px;
        }

        .bienvenida {
            text-align: center;
            margin-bottom: 28px;
        }

        .bienvenida h2 {
            color: #172B3A;
            margin-bottom: 8px;
        }

        .bienvenida p {
            color: #526572;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #172B3A;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 15px;
            border: 2px solid #D8E4EB;
            border-radius: 13px;
            font-size: 16px;
            background: white;
        }

        .campo input:focus,
        .campo select:focus {
            outline: none;
            border-color: #145DA0;
        }

        .grupo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .boton-comenzar {
            width: 100%;
            border: none;
            background: #145DA0;
            color: white;
            padding: 17px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .boton-comenzar:hover {
            background: #0B3C5D;
        }

        .aviso-registro {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background: #EAF5FF;
            color: #0B3C5D;
            font-size: 14px;
            text-align: center;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            background: #FDECEC;
            color: #9E1F1F;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .registro-contenedor {
                padding: 24px 18px;
                border-radius: 20px;
            }

            .logo-registro h1 {
                font-size: 30px;
            }

            .grupo {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .campo input,
            .campo select {
                font-size: 16px;
                min-height: 52px;
            }

            .boton-comenzar {
                min-height: 56px;
            }
        }

        @media (max-width: 320px) {
            .registro-contenedor {
                padding: 18px 13px;
            }

            .logo-registro h1 {
                font-size: 26px;
            }

            .bienvenida h2 {
                font-size: 21px;
            }

            .bienvenida p,
            .aviso-registro {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="registro-contenedor">

        <div class="logo-registro">
            <h1>NORAPP</h1>
            <p>Tu apoyo, siempre contigo</p>
        </div>

        <div class="bienvenida">
            <h2>¡Bienvenido/a a NorApp! 👋</h2>
            <p>
                Para personalizar tu experiencia, necesitamos algunos datos.
            </p>
        </div>

        <form id="formularioRegistro">

            <div class="campo">
                <label for="nombre">¿Cómo te llamas?</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="grupo">

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input
                        type="number"
                        id="edad"
                        placeholder="Ej. 72"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="ciudad">Ciudad</label>
                    <input
                        type="text"
                        id="ciudad"
                        placeholder="Ej. Santiago"
                        required
                    >
                </div>

            </div>

            <div class="campo">
                <label for="contacto">Persona de contacto</label>
                <input
                    type="text"
                    id="contacto"
                    placeholder="Ej. Ana González"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefono">Teléfono de contacto</label>
                <input
                    type="tel"
                    id="telefono"
                    placeholder="+56 9 1234 5678"
                    autocomplete="tel"
                    required
                >
            </div>

            <button type="submit" class="boton-comenzar">
                Comenzar con NorApp
            </button>

            <div id="errorRegistro" class="error"></div>

        </form>

        <div class="aviso-registro">
            🔒 Estos datos se utilizarán para personalizar esta demostración de NorApp.
        </div>

    </main>

    <script>
        document.getElementById("formularioRegistro").addEventListener("submit", function(event) {

            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const edad = document.getElementById("edad").value.trim();
            const ciudad = document.getElementById("ciudad").value.trim();
            const contacto = document.getElementById("contacto").value.trim();
            const telefono = document.getElementById("telefono").value.trim();

            const error = document.getElementById("errorRegistro");

            if (!nombre || !edad || !ciudad || !contacto || !telefono) {
                error.textContent = "Por favor, completa todos los campos.";
                error.style.display = "block";
                return;
            }

            localStorage.setItem("norappUsuario", nombre);
            localStorage.setItem("norappEdad", edad);
            localStorage.setItem("norappCiudad", ciudad);
            localStorage.setItem("norappContacto", contacto);
            localStorage.setItem("norappTelefono", telefono);
            localStorage.setItem("norappConfigurado", "true");

            window.location.href = "../index.html";
        });
    </script>

</body>
</html>
```
